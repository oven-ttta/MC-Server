      - ''
      - '&e✨ Resource Pack: &bFaithful 64x &7(กราฟิกสวยขึ้น 4 เท่า!)'
      - '&e✨ Shader Pack: &dSildur''s Vibrant &7(แสงเงาสมจริง!)'
