# ไฟล์ config สำหรับ AutoBroadcast / AutoMessage
# แจ้งเตือนผู้เล่นให้ดาวน์โหลด Resource Pack และ Shader

# ตั้งค่าทั่วไป
enabled: true
interval: 600  # 10 นาที (600 วินาที)
random: false
prefix: '&6[Server]&r'

# ข้อความที่จะแจ้ง
